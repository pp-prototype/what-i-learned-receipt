<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://qncyukpaygjfzjyvefje.supabase.co wss://qncyukpaygjfzjyvefje.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>what-i-learned-receipt</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script src="./assets/app.js" defer></script>
</head>
<body class="min-h-screen bg-[#f6efe3] text-stone-900">
  <main class="min-h-screen px-5 py-8 sm:px-8 sm:py-12">
    <section class="mx-auto flex w-full max-w-5xl flex-col gap-8 lg:grid lg:grid-cols-[0.9fr_1.1fr] lg:items-center">
      <div class="space-y-5">
        <p class="w-fit rounded-full border border-emerald-700/20 bg-emerald-50 px-4 py-2 text-sm font-semibold text-emerald-800">
          학습일지 영수증 웹
        </p>
        <div class="space-y-3">
          <h1 class="text-4xl font-black leading-tight text-stone-950 sm:text-5xl">
            오늘 배운 것을<br class="hidden sm:block" />
            한 장의 엽서처럼 남기기
          </h1>
          <p class="max-w-md text-base leading-7 text-stone-700">
            사진과 짧은 기록을 담아 오늘의 학습을 영수증 이미지로 발행합니다.
          </p>
        </div>

        <section class="max-w-md rounded-[8px] border border-stone-200 bg-white/70 p-5 shadow-sm backdrop-blur">
          <form id="login-form" class="space-y-3">
            <div>
              <h2 class="text-base font-black text-stone-950">내 프로젝트 시작하기</h2>
              <p class="mt-1 text-sm leading-6 text-stone-600">
                이메일로 받은 로그인 링크를 누르면 프로젝트를 저장하고 다시 선택할 수 있어요.
              </p>
            </div>
            <label class="block">
              <span class="sr-only">이메일</span>
              <input
                id="login-email"
                type="email"
                autocomplete="email"
                maxlength="254"
                inputmode="email"
                autocapitalize="none"
                spellcheck="false"
                required
                placeholder="you@example.com"
                class="w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
              />
            </label>
            <div id="turnstile-container" class="min-h-[65px]" aria-label="자동 로그인 시도 방지"></div>
            <button
              id="login-submit"
              type="submit"
              class="flex w-full items-center justify-center rounded-[8px] bg-emerald-700 px-4 py-3 text-sm font-black text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-200 disabled:cursor-wait disabled:opacity-60"
            >
              이메일로 로그인
            </button>
          </form>

          <div id="user-panel" class="hidden items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="text-xs font-bold text-stone-500">로그인됨</p>
              <p id="user-email" class="truncate text-sm font-black text-stone-900"></p>
            </div>
            <button
              id="logout-button"
              type="button"
              class="shrink-0 rounded-[8px] border border-stone-200 bg-white px-3 py-2 text-xs font-bold text-stone-700 transition hover:bg-stone-50"
            >
              로그아웃
            </button>
          </div>

          <p id="auth-message" class="mt-3 hidden rounded-[8px] px-3 py-2 text-sm leading-6" role="status" aria-live="polite"></p>
        </section>
      </div>

      <article id="receipt-editor" class="relative mx-auto hidden w-full max-w-md rounded-[8px] border border-stone-200 bg-[#fffaf1] p-5 shadow-postcard sm:p-7">
        <div class="absolute left-0 top-8 h-10 w-1.5 rounded-r-full bg-[#f97316]"></div>
        <div class="absolute right-5 top-5 rounded-full bg-rose-100 px-3 py-1 text-xs font-bold text-rose-700">
          TODAY
        </div>

        <header class="border-b border-dashed border-stone-300 pb-5">
          <p class="text-xs font-bold uppercase tracking-[0.22em] text-stone-500">Learning Receipt</p>
          <div class="mt-4 flex items-end justify-between gap-4">
            <div>
              <label for="today-date" class="text-xs font-semibold text-stone-500">날짜</label>
              <input
                id="today-date"
                type="text"
                readonly
                class="mt-1 w-full bg-transparent text-lg font-black text-stone-950 outline-none"
              />
            </div>
            <span class="rounded-full bg-sky-100 px-3 py-1 text-xs font-bold text-sky-700">PNG</span>
          </div>
        </header>

        <div class="space-y-5 py-5">
          <div>
            <div class="flex items-center justify-between gap-3">
              <label for="receipt-project" class="text-sm font-bold text-stone-800">프로젝트</label>
              <button
                id="open-project-dialog"
                type="button"
                class="text-xs font-black text-emerald-700 transition hover:text-emerald-800"
              >
                + 새 프로젝트
              </button>
            </div>
            <select
              id="receipt-project"
              required
              class="mt-2 w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm font-semibold outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100 disabled:cursor-wait disabled:bg-stone-100"
            >
              <option value="">프로젝트를 불러오는 중...</option>
            </select>
            <p id="project-subtitle" class="mt-1.5 hidden text-xs leading-5 text-stone-500"></p>
          </div>

          <label class="block">
            <span class="text-sm font-bold text-stone-800">제목</span>
            <input
              id="receipt-title"
              type="text"
              maxlength="80"
              placeholder="오늘의 학습 제목"
              class="mt-2 w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
            />
          </label>

          <label class="block">
            <span class="flex items-center justify-between gap-3">
              <span class="text-sm font-bold text-stone-800">부제</span>
              <span class="text-xs font-semibold text-stone-400">선택</span>
            </span>
            <input
              id="receipt-subtitle"
              type="text"
              maxlength="120"
              placeholder="오늘의 진전을 한 줄로 요약해보세요."
              class="mt-2 w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
            />
          </label>

          <div class="block">
            <span class="text-sm font-bold text-stone-800">사진</span>
            <label
              for="photo-upload"
              class="relative mt-2 flex aspect-[4/3] cursor-pointer items-center justify-center overflow-hidden rounded-[8px] border-2 border-dashed border-orange-200 bg-orange-50 text-center transition hover:border-orange-300 hover:bg-orange-100"
            >
              <img
                id="photo-preview"
                src=""
                alt="업로드한 학습 사진 미리보기"
                class="hidden h-full w-full bg-white object-contain"
              />
              <div id="photo-placeholder" class="px-5">
                <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-white text-2xl shadow-sm">
                  +
                </div>
                <p class="text-sm font-bold text-stone-800">사진 업로드</p>
                <p class="mt-1 text-xs text-stone-500">오늘의 장면 1장</p>
              </div>
              <input id="photo-upload" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" class="sr-only" />
            </label>
            <button
              id="photo-remove"
              type="button"
              class="mt-2 hidden text-xs font-bold text-rose-600 transition hover:text-rose-700"
            >
              사진 제거
            </button>
          </div>

          <label class="block">
            <span class="text-sm font-bold text-stone-800">오늘 배운 것</span>
            <textarea
              id="receipt-note"
              rows="5"
              maxlength="2000"
              placeholder="짧게 기록해보세요."
              class="mt-2 w-full resize-none rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm leading-6 outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
            ></textarea>
          </label>
        </div>

        <footer class="border-t border-dashed border-stone-300 pt-5">
          <button
            id="download-receipt"
            type="button"
            class="flex w-full items-center justify-center rounded-[8px] bg-[#2563eb] px-5 py-4 text-sm font-black text-white shadow-lg shadow-blue-800/20 transition hover:bg-[#1d4ed8] focus:outline-none focus:ring-4 focus:ring-blue-200"
          >
            영수증 발행하기
          </button>
          <p class="mt-4 text-center text-xs font-semibold text-stone-400">what-i-learned-receipt</p>
        </footer>
      </article>
    </section>
  </main>

  <dialog id="project-dialog" class="w-[calc(100%-2.5rem)] max-w-md rounded-[12px] bg-[#fffaf1] p-0 shadow-2xl backdrop:bg-stone-950/40">
    <form id="project-form" class="p-6 sm:p-7">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.18em] text-emerald-700">New project</p>
          <h2 class="mt-2 text-2xl font-black text-stone-950">새 프로젝트 만들기</h2>
          <p class="mt-2 text-sm leading-6 text-stone-600">앞으로 반복해서 선택할 기록 묶음을 만들어주세요.</p>
        </div>
        <button
          id="close-project-dialog"
          type="button"
          aria-label="프로젝트 만들기 닫기"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-stone-100 text-lg font-bold text-stone-600 transition hover:bg-stone-200"
        >
          ×
        </button>
      </div>

      <div class="mt-6 space-y-4">
        <label class="block">
          <span class="text-sm font-bold text-stone-800">프로젝트명</span>
          <input
            id="project-name"
            type="text"
            maxlength="50"
            required
            placeholder="예: 사이드 프로젝트, 독서 기록"
            class="mt-2 w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
          />
        </label>
        <label class="block">
          <span class="flex items-center justify-between gap-3">
            <span class="text-sm font-bold text-stone-800">프로젝트 부제</span>
            <span class="text-xs font-semibold text-stone-400">선택</span>
          </span>
          <input
            id="project-description"
            type="text"
            maxlength="100"
            placeholder="프로젝트의 목표를 한 줄로 적어보세요."
            class="mt-2 w-full rounded-[8px] border border-stone-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100"
          />
        </label>
      </div>

      <p id="project-form-message" class="mt-4 hidden rounded-[8px] bg-rose-50 px-3 py-2 text-sm leading-6 text-rose-700" role="alert"></p>

      <button
        id="project-submit"
        type="submit"
        class="mt-6 flex w-full items-center justify-center rounded-[8px] bg-emerald-700 px-5 py-4 text-sm font-black text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-4 focus:ring-emerald-200 disabled:cursor-wait disabled:opacity-60"
      >
        프로젝트 만들기
      </button>
    </form>
  </dialog>

</body>
</html>
